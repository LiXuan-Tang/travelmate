<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelMate — Shared Trip</title>
  <!-- iOS Smart App Banner (replace APP_STORE_ID with your real App Store ID when published) -->
  <!-- <meta name="apple-itunes-app" content="app-id=APP_STORE_ID, app-argument=travelmate://shared-trip/POSTID"> -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fdf9ec;
      min-height: 100vh;
      color: #111827;
    }
    .spinner-page {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #e5e7eb;
      border-top-color: #006a66;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 15px; color: #6b7280; }

    #trip-card {
      display: none;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }
    .hero {
      width: 100%; height: 220px;
      object-fit: cover;
      border-radius: 20px;
      background: #e0f2f1;
      margin-bottom: 20px;
    }
    .hero-placeholder {
      width: 100%; height: 220px;
      background: linear-gradient(135deg, #e0f2f1, #b2dfdb);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 56px;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: #10b981; color: #fff;
      font-size: 11px; font-weight: 700;
      padding: 4px 12px; border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .meta { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .meta-item { font-size: 13px; color: #6b7280; display: flex; align-items: center; gap: 5px; }
    .caption {
      font-size: 14px; color: #374151; line-height: 1.6;
      background: #fff; border-radius: 16px;
      padding: 16px; margin-bottom: 20px;
    }
    .dest-section h2 {
      font-size: 15px; font-weight: 700; margin-bottom: 12px;
    }
    .day-group { margin-bottom: 20px; }
    .day-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px;
    }
    .day-badge {
      width: 24px; height: 24px; border-radius: 50%;
      background: #006a66; color: #fff;
      font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .day-label { font-size: 13px; font-weight: 700; color: #111827; }
    .day-line { flex: 1; height: 1px; background: #e5e7eb; }
    .dest-item {
      display: flex; align-items: center; gap: 12px;
      background: #fff; border-radius: 16px;
      padding: 12px; margin-bottom: 8px;
    }
    .dest-icon { font-size: 20px; flex-shrink: 0; }
    .dest-name { font-size: 14px; font-weight: 600; }
    .dest-addr { font-size: 12px; color: #6b7280; margin-top: 2px; }

    .cta-bar {
      position: sticky; bottom: 0;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .btn-primary {
      display: block; text-align: center;
      background: #006a66; color: #fff;
      padding: 14px; border-radius: 999px;
      font-size: 15px; font-weight: 600;
      text-decoration: none; cursor: pointer; border: none; width: 100%;
    }
    .btn-secondary {
      display: block; text-align: center;
      background: transparent; color: #006a66;
      padding: 10px; border-radius: 999px;
      font-size: 14px; font-weight: 600;
      text-decoration: none; cursor: pointer; border: 2px solid #006a66; width: 100%;
    }
    #error-page {
      display: none;
      flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px; text-align: center;
    }
    #error-page h2 { font-size: 20px; margin-bottom: 8px; }
    #error-page p { font-size: 14px; color: #6b7280; margin-bottom: 24px; }
  </style>
</head>
<body>

  <!-- Loading state -->
  <div id="loading" class="spinner-page">
    <div class="spinner"></div>
    <p class="loading-text">Loading trip…</p>
  </div>

  <!-- Trip card (shown after load) -->
  <div id="trip-card">
    <div id="hero-container"></div>
    <div class="badge">🗺️ Shared Itinerary</div>
    <h1 id="trip-title"></h1>
    <div class="meta">
      <span class="meta-item" id="meta-duration"></span>
      <span class="meta-item" id="meta-dests"></span>
    </div>
    <div class="caption" id="trip-caption" style="display:none"></div>
    <div class="dest-section">
      <h2>Destinations</h2>
      <div id="dest-list"></div>
    </div>
    <!-- Spacer for sticky CTA -->
    <div style="height:120px"></div>
  </div>

  <!-- Error state -->
  <div id="error-page">
    <div style="font-size:48px;margin-bottom:16px">😕</div>
    <h2>Trip Not Found</h2>
    <p>This shared trip may have been removed or the link is invalid.</p>
    <a href="/" class="btn-primary" style="max-width:280px">Go to TravelMate</a>
  </div>

  <!-- Sticky CTA bar -->
  <div class="cta-bar" id="cta-bar" style="display:none">
    <button class="btn-primary" id="btn-open-app">Open in TravelMate App</button>
    <a href="https://expo.dev/accounts/lixuan_not_carrot/projects/TravelMate" class="btn-secondary">
      Download TravelMate
    </a>
  </div>

  <script>
    const FIREBASE_PROJECT = 'travelmate-2f670';
    const FIREBASE_API_KEY = 'AIzaSyChaHM2LIwvxFkWLyMNF6_0B76sy6E-AOo';
    const FIRESTORE_BASE = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;

    // Extract postId from path: /trip/{postId}
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const postId = pathParts[1] || pathParts[0];

    function showError() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-page').style.display = 'flex';
    }

    function firestoreValue(field) {
      if (!field) return null;
      return field.stringValue ?? field.integerValue ?? field.booleanValue ?? null;
    }

    function firestoreArray(field) {
      if (!field?.arrayValue?.values) return [];
      return field.arrayValue.values.map(v => firestoreValue(v)).filter(Boolean);
    }

    async function fetchDocument(collection, id) {
      const url = `${FIRESTORE_BASE}/${collection}/${id}?key=${FIREBASE_API_KEY}`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const json = await res.json();
      if (json.error) return null;
      return json.fields;
    }

    async function fetchDestinations(tripId) {
      const url = `${FIRESTORE_BASE}/trips/${tripId}/destinations?key=${FIREBASE_API_KEY}`;
      const res = await fetch(url);
      if (!res.ok) return [];
      const json = await res.json();
      if (!json.documents) return [];
      return json.documents.map(d => ({
        name: firestoreValue(d.fields.name),
        address: firestoreValue(d.fields.address),
        // Firestore REST returns timestamps as ISO strings in timestampValue
        dateMs: d.fields.date?.timestampValue
          ? new Date(d.fields.date.timestampValue).getTime()
          : 0,
        order: parseInt(firestoreValue(d.fields.order) ?? '0', 10),
      }));
    }

    function groupByDay(destinations) {
      if (destinations.length === 0) return [];
      const sorted = [...destinations].sort((a, b) => {
        if (a.dateMs !== b.dateMs) return a.dateMs - b.dateMs;
        return a.order - b.order;
      });
      const baseMs = sorted.find(d => d.dateMs > 0)?.dateMs ?? 0;
      const MS_PER_DAY = 86400 * 1000;
      const dayMap = new Map();
      for (const dest of sorted) {
        const dayNum = baseMs > 0 && dest.dateMs > 0
          ? Math.max(1, Math.floor((dest.dateMs - baseMs) / MS_PER_DAY) + 1)
          : 1;
        const bucket = dayMap.get(dayNum) ?? [];
        bucket.push(dest);
        dayMap.set(dayNum, bucket);
      }
      return Array.from(dayMap.entries())
        .sort(([a], [b]) => a - b)
        .map(([day, items]) => ({ day, items }));
    }

    async function loadTrip() {
      if (!postId) { showError(); return; }

      // Attempt to open the app immediately (custom scheme)
      const appSchemeUrl = `travelmate://shared-trip/${postId}`;
      window.location.href = appSchemeUrl;

      // Fetch post data in parallel
      let fields;
      try {
        fields = await fetchDocument('posts', postId);
      } catch {
        showError();
        return;
      }

      if (!fields) { showError(); return; }

      const title = firestoreValue(fields.title) || 'Untitled Trip';
      const body = firestoreValue(fields.body);
      const images = firestoreArray(fields.images);
      const tripId = firestoreValue(fields.tripId);
      const destinationCount = firestoreValue(fields.destinationCount);
      const tripDuration = firestoreValue(fields.tripDuration);
      const type = firestoreValue(fields.type);

      if (type !== 'shared_itinerary') { showError(); return; }

      // Hero image
      const heroContainer = document.getElementById('hero-container');
      if (images.length > 0) {
        heroContainer.innerHTML = `<img class="hero" src="${images[0]}" alt="${title}" onerror="this.style.display='none'">`;
      } else {
        heroContainer.innerHTML = `<div class="hero-placeholder">✈️</div>`;
      }

      document.getElementById('trip-title').textContent = title;

      if (tripDuration) {
        document.getElementById('meta-duration').innerHTML = `🗓️ ${tripDuration}`;
      }
      if (destinationCount) {
        const n = parseInt(destinationCount, 10);
        document.getElementById('meta-dests').innerHTML = `📍 ${n} destination${n !== 1 ? 's' : ''}`;
      }
      if (body) {
        const captionEl = document.getElementById('trip-caption');
        captionEl.textContent = body;
        captionEl.style.display = 'block';
      }

      // Fetch and render destinations grouped by day
      if (tripId) {
        const dests = await fetchDestinations(tripId);
        const list = document.getElementById('dest-list');
        if (dests.length > 0) {
          const groups = groupByDay(dests);
          list.innerHTML = groups.map(({ day, items }) => `
            <div class="day-group">
              <div class="day-header">
                <span class="day-badge">${day}</span>
                <span class="day-label">Day ${day}</span>
                <div class="day-line"></div>
              </div>
              ${items.map(d => `
                <div class="dest-item">
                  <span class="dest-icon">📍</span>
                  <div>
                    <div class="dest-name">${d.name || ''}</div>
                    <div class="dest-addr">${d.address || ''}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          `).join('');
        } else {
          list.innerHTML = `<p style="font-size:13px;color:#9ca3af">No destinations listed.</p>`;
        }
      }

      // Show trip card
      document.getElementById('loading').style.display = 'none';
      document.getElementById('trip-card').style.display = 'block';
      document.getElementById('cta-bar').style.display = 'flex';
    }

    // Wire up "Open in App" button
    document.getElementById('btn-open-app').addEventListener('click', () => {
      window.location.href = `travelmate://shared-trip/${postId}`;
    });

    loadTrip();
  </script>
</body>
</html>
